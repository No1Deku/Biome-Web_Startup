<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Your Biome Account</title>

    <link
        rel="stylesheet"
        href="sign-up.css"
    >

    <!-- Google Icons -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
    >

    <!-- Supabase -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <!-- Authentication -->
    <script
        defer
        src="sign-up.js"
    ></script>

</head>

<body>

<div class="container">

    <form
        id="signup-form"
        novalidate
    >

        <div class="logo">

            <h1>Biome</h1>

            <p>
                South Africa's Modern Property Marketplace
            </p>

        </div>

        <h2>Create Your Account</h2>

        <span class="subtitle">

            Join Biome to discover, buy, rent and manage
            properties across South Africa.

        </span>

        <!-- ========================= -->
        <!-- NAME -->
        <!-- ========================= -->

        <div class="form-row">

            <div>

                <label for="first-name">
                    First Name
                </label>

                <input
                    type="text"
                    id="first-name"
                    placeholder="John"
                    maxlength="50"
                    autocomplete="given-name"
                    required
                >

            </div>

            <div>

                <label for="surname">
                    Surname
                </label>

                <input
                    type="text"
                    id="surname"
                    placeholder="Doe"
                    maxlength="50"
                    autocomplete="family-name"
                    required
                >

            </div>

        </div>

        <!-- ========================= -->
        <!-- DOB & ACCOUNT TYPE -->
        <!-- ========================= -->

        <div class="form-row">

            <div>

                <label for="dob">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    required
                >

            </div>

            <div>

                <label for="account-type">

                    Account Type

                </label>

                <select
                    id="account-type"
                    required
                >

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="buyer">
                        Property Buyer
                    </option>

                    <option value="seller">
                        Property Seller
                    </option>

                    <option value="admin">
                        Administrator
                    </option>

                </select>

            </div>

        </div>

        <!-- ========================= -->
        <!-- EMAIL & PHONE -->
        <!-- ========================= -->

        <div class="form-row">

            <div>

                <label for="email">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div>

                <label for="phone">

                    Phone Number

                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+27 82 123 4567"
                    autocomplete="tel"
                    maxlength="20"
                    required
                >

            </div>

        </div>

        <!-- ========================= -->
        <!-- COUNTRY -->
        <!-- ========================= -->

        <div>

            <label for="country">

                Country

            </label>

            <input
                type="text"
                id="country"
                value="South Africa"
                autocomplete="country-name"
                required
            >

        </div>

        <!-- ========================= -->
        <!-- PASSWORD -->
        <!-- ========================= -->

        <div class="form-row">

            <div>

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>

            <div>

                <label for="confirm-password">

                    Confirm Password

                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Re-enter password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>

        </div>

        <!-- Password Requirements -->

        <div class="password-info">

            Password must contain at least
            <strong>8 characters</strong>.

        </div>

        <!-- ========================= -->
        <!-- CREATE ACCOUNT -->
        <!-- ========================= -->

        <button
            id="signup-button"
            type="submit"
        >

            Create Account

        </button>

        <!-- ========================= -->
        <!-- STATUS MESSAGE -->
        <!-- ========================= -->
        
        <div
            id="status-message"
            class="status-message"
        >

        </div>

        <!-- ========================= -->
        <!-- SIGN IN LINK -->
        <!-- ========================= -->

        <div class="signin-link">

            Already have an account?

            <a href="sign-in.html">

                Sign In

            </a>

        </div>

    </form>

</div>

</body>

</html>
